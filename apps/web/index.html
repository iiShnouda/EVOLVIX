<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- iPhone/iPad home-screen icon (iOS ignores SVG icons). -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Evolvix" />
    <title>Evolvix</title>
    <!--
      Boot splash: shown the instant the page opens, so the app never flashes a blank/black screen
      while the code loads or while it is reaching the server. React replaces #root once it mounts;
      if that hasn't happened after a while (code didn't load, or the server is unreachable), the
      splash turns into a clear "server unavailable" message with a Retry button, never a black void.
    -->
    <style>
      :root { --boot-bg: #f6f7fb; --boot-fg: #1f2937; --boot-muted: #6b7280; --boot-brand: #4f46e5; }
      @media (prefers-color-scheme: dark) {
        :root { --boot-bg: #0b1020; --boot-fg: #e5e7eb; --boot-muted: #9aa4b2; }
      }
      html, body { margin: 0; height: 100%; background: var(--boot-bg); }
      #boot {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 18px; padding: 24px; text-align: center;
        font-family: 'Segoe UI', system-ui, -apple-system, 'Noto Sans Arabic', sans-serif;
        color: var(--boot-fg); background: var(--boot-bg);
      }
      #boot .mark { width: 72px; height: 72px; border-radius: 20px; box-shadow: 0 10px 30px rgba(79,70,229,.35); }
      #boot h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
      #boot p { margin: 0; font-size: 14px; color: var(--boot-muted); max-width: 320px; word-break: break-word; }
      #boot .spin {
        width: 26px; height: 26px; border-radius: 50%; border: 3px solid rgba(127,127,127,.25);
        border-top-color: var(--boot-brand); animation: boot-spin .8s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      #boot .retry {
        display: none; margin-top: 4px; height: 42px; padding: 0 22px; border: 0; border-radius: 10px;
        background: var(--boot-brand); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
      }
      #boot.failed .spin { display: none; }
      #boot.failed .retry { display: inline-block; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <svg class="mark" viewBox="0 0 512 512" aria-hidden="true">
          <defs>
            <linearGradient id="bootbg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#7263ff" />
              <stop offset=".55" stop-color="#4f46e5" />
              <stop offset="1" stop-color="#3423b5" />
            </linearGradient>
            <linearGradient id="bootup" x1="136" y1="386" x2="376" y2="126" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#0ea371" />
              <stop offset=".55" stop-color="#34d399" />
              <stop offset="1" stop-color="#b4f8d8" />
            </linearGradient>
          </defs>
          <rect width="512" height="512" rx="116" fill="url(#bootbg)" />
          <path d="M136 126C178.2 144.4 203.7 166.4 221.3 189.9M290.7 322.1C308.3 345.6 333.8 367.6 376 386"
                fill="none" stroke="#fff" stroke-width="54" stroke-linecap="round" />
          <path d="M136 386C296 316 216 196 376 126" fill="none" stroke="url(#bootup)" stroke-width="54" stroke-linecap="round" />
          <path d="M428 60q3 22 25 25q-22 3-25 25q-3-22-25-25q22-3 25-25Z" fill="#d1fae5" />
        </svg>
        <h1>Evolvix</h1>
        <div class="spin" role="status" aria-label="Loading"></div>
        <p id="boot-msg" dir="auto">جارٍ الاتصال بالخادم…<br />Connecting to the server…</p>
        <button class="retry" type="button" onclick="location.reload()">إعادة المحاولة · Retry</button>
      </div>
    </div>
    <script>
      // If React hasn't replaced #root after a while, the code didn't load or the server is down.
      (function () {
        setTimeout(function () {
          var boot = document.getElementById('boot');
          if (!boot) return; // React mounted and replaced the splash — all good.
          boot.className = 'failed';
          var msg = document.getElementById('boot-msg');
          if (msg) msg.innerHTML = 'الخادم غير متاح حالياً. تأكد أن السيرفر يعمل ثم أعد المحاولة.<br />The server is unavailable. Make sure it is running, then retry.';
        }, 12000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
