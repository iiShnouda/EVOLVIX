# SKB — local/company-server database.
# Runs the same PostgreSQL engine you'll host on the company server PC,
# so moving to a cloud DB later is a connection-string change, not a rewrite.
services:
  db:
    image: postgres:16-alpine
    container_name: skb-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skb_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-skb}
    ports:
      # Only this machine reaches the database (the app talks to it over the private Docker
      # network); nobody else on the office network can connect to it.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - skb-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skb} -d ${POSTGRES_DB:-skb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The whole app (web + C# API in one image), for running on your own company server.
  # Started only with the "full" profile:  docker compose --profile full up -d --build
  # Everything then lives on THIS machine — data in the skb-db-data volume, no cloud.
  app:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: skb-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:8080
      # Talks to the db service over the private Docker network (host name "db").
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB:-skb};Username=${POSTGRES_USER:-skb};Password=${POSTGRES_PASSWORD:-skb_dev_password};Pooling=true;Maximum Pool Size=20"
      Jwt__AccessSecret: "${JWT_ACCESS_SECRET:-change_me_to_a_long_random_secret}"
      Security__SessionEncryptionKey: "${SESSION_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}"
      Cookie__Secure: "${COOKIE_SECURE:-false}"
      Seed__OwnerEmail: "${SEED_OWNER_EMAIL:-owner@skb.local}"
      Seed__OwnerPassword: "${SEED_OWNER_PASSWORD:-ChangeMe!Owner123}"
      # true only for a demo server: a fresh database then gets sample staff, items and invoices.
      Seed__Demo: "${SEED_DEMO:-false}"
      # Automatic backups: every day at BACKUP_HOUR (company time, Settings → time zone) into ./backups, newest BACKUP_KEEP
      # kept, encrypted when BACKUP_PASSPHRASE is set. See COMPANY-SERVER.md.
      TZ: "${TZ:-Africa/Cairo}"
      Backup__Folder: /backups
      Backup__Hour: "${BACKUP_HOUR:-2}"
      Backup__Keep: "${BACKUP_KEEP:-14}"
      Backup__Passphrase: "${BACKUP_PASSPHRASE:-}"
      # The offline assistant (owner, 2026-10-06): the model server below, on the private network only.
      Assistant__Enabled: "${ASSISTANT_ENABLED:-true}"
      Assistant__Endpoint: http://assistant:11434
      Assistant__Model: "${ASSISTANT_MODEL:-qwen2.5:7b-instruct}"
      Assistant__VisionModel: "${ASSISTANT_VISION_MODEL:-qwen2.5vl:7b}"
      # Spoken questions (owner, 2026-10-10): read by the speech service below, on this machine.
      Assistant__SpeechEndpoint: "${ASSISTANT_SPEECH_ENDPOINT:-http://speech:9000}"
      # Its voice (owner, 2026-10-11: talk with it by voice): the voice service below.
      Assistant__VoiceEndpoint: "${ASSISTANT_VOICE_ENDPOINT:-http://voice:5000}"
    volumes:
      - "${BACKUP_DIR:-./backups}:/backups"
    ports:
      # Staff on the LAN reach the app at http://<this-server-ip>:8080
      - "${APP_PORT:-8080}:8080"

  # The company's own AI models (Ollama), run on this machine with no internet needed after the
  # first download. No port is published: only the app reaches it, over the private Docker network,
  # so nobody on the office network or outside can talk to it or see the server through it.
  assistant:
    profiles: ["full"]
    image: ollama/ollama:latest
    container_name: skb-assistant
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "30m"
    volumes:
      - skb-assistant-models:/root/.ollama

  # Downloads the two models once (a few GB), then stops. Run again to update them.
  assistant-models:
    profiles: ["full"]
    image: ollama/ollama:latest
    restart: "no"
    depends_on:
      - assistant
    environment:
      OLLAMA_HOST: assistant:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        sleep 5 &&
        ollama pull ${ASSISTANT_MODEL:-qwen2.5:7b-instruct} &&
        ollama pull ${ASSISTANT_VISION_MODEL:-qwen2.5vl:7b}

  # Speech to text for spoken questions (Whisper, MIT licence), on this machine; the model downloads
  # once on first start. No port is published: only the app reaches it, and recordings aren't kept.
  speech:
    profiles: ["full"]
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: skb-speech
    restart: unless-stopped
    environment:
      ASR_ENGINE: faster_whisper
      ASR_MODEL: "${SPEECH_MODEL:-small}"
      ASR_MODEL_PATH: /data/whisper
    volumes:
      - skb-speech-models:/data/whisper

  # Reads the assistant's answers aloud (Piper, apps/voice) with an Arabic and an English voice, on
  # this machine; the voices download once on first start. No port is published: only the app
  # reaches it, and nothing it says is kept.
  voice:
    profiles: ["full"]
    build: ./apps/voice
    container_name: skb-voice
    restart: unless-stopped
    environment:
      VOICE_AR: "${VOICE_AR:-ar_JO-kareem-medium}"
      VOICE_EN: "${VOICE_EN:-en_US-hfc_female-medium}"
    volumes:
      - skb-voice-models:/data/voices

volumes:
  skb-db-data:
    name: skb-db-data
  skb-assistant-models:
    name: skb-assistant-models
  skb-speech-models:
    name: skb-speech-models
  skb-voice-models:
    name: skb-voice-models
