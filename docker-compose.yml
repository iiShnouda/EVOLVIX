# SKB — local/company-server database.
# Runs the same PostgreSQL engine you'll host on the company server PC,
# so moving to a cloud DB later is a connection-string change, not a rewrite.
services:
  db:
    image: postgres:16-alpine
    container_name: skb-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skb_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-skb}
    ports:
      # Exposed on the host so the API server (and, on the LAN, other machines) can reach it.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - skb-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skb} -d ${POSTGRES_DB:-skb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The whole app (web + C# API in one image), for running on your own company server.
  # Started only with the "full" profile:  docker compose --profile full up -d --build
  # Everything then lives on THIS machine — data in the skb-db-data volume, no cloud.
  app:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: skb-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:8080
      # Talks to the db service over the private Docker network (host name "db").
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB:-skb};Username=${POSTGRES_USER:-skb};Password=${POSTGRES_PASSWORD:-skb_dev_password};Pooling=true;Maximum Pool Size=20"
      Jwt__AccessSecret: "${JWT_ACCESS_SECRET:-change_me_to_a_long_random_secret}"
      Security__SessionEncryptionKey: "${SESSION_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}"
      Cookie__Secure: "${COOKIE_SECURE:-false}"
      Seed__OwnerEmail: "${SEED_OWNER_EMAIL:-owner@skb.local}"
      Seed__OwnerPassword: "${SEED_OWNER_PASSWORD:-ChangeMe!Owner123}"
      # Automatic backups: every day at BACKUP_HOUR (server time) into ./backups, newest BACKUP_KEEP
      # kept, encrypted when BACKUP_PASSPHRASE is set. See COMPANY-SERVER.md.
      TZ: "${TZ:-Africa/Cairo}"
      Backup__Folder: /backups
      Backup__Hour: "${BACKUP_HOUR:-2}"
      Backup__Keep: "${BACKUP_KEEP:-14}"
      Backup__Passphrase: "${BACKUP_PASSPHRASE:-}"
    volumes:
      - "${BACKUP_DIR:-./backups}:/backups"
    ports:
      # Staff on the LAN reach the app at http://<this-server-ip>:8080
      - "${APP_PORT:-8080}:8080"

volumes:
  skb-db-data:
    name: skb-db-data
